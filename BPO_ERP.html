const RATES = { incentivePool: 25000, calloutDed: 3000, ncnsDed: 5000, ulDed: 2500, lateDed: 200, edRate: 250, extraHourRate: 250, extraShift: 3500 };

function ttDeduction(tt) {
  if (tt < 176) return 0;
  if (tt >= 199) return 7000;
  if (tt >= 190) return 5000;
  if (tt >= 185) return 4000;
  if (tt >= 180) return 3000;
  return 2000;
}
// "or below" tiers — worst applicable tier only; above 91% = no deduction
function qualityDeduction(q) {
  if (q <= 80) return 4000;
  if (q <= 85) return 3000;
  if (q <= 87) return 2200;
  if (q <= 88) return 1600;
  if (q <= 89) return 920;
  if (q <= 91) return 400;
  return 0;
}
function tallyAttendance(empId, log) {
  const rows = log.filter((l) => l.empId === empId);
  const t = { late: 0, callout: 0, ncns: 0, ul: 0, edHours: 0, exHours: 0, extraShifts: 0 };
  rows.forEach((r) => {
    if (r.type === "LA") t.late++;
    else if (r.type === "CALLOUT") t.callout++;
    else if (r.type === "NCNS") t.ncns++;
    else if (r.type === "UL") t.ul++;
    else if (r.type === "ED") t.edHours += Number(r.detail) || 0;
    else if (r.type === "EX") t.exHours += Number(r.detail) || 0;
    else if (r.type === "EXSHIFT") t.extraShifts++;
  });
  t.edHours = Math.round(t.edHours * 100) / 100;
  t.exHours = Math.round(t.exHours * 100) / 100;
  return t;
}
function computePay(e, att, errorUsdTotal, errorRate) {
  const ttDed = ttDeduction(e.tt);
  const qDed = qualityDeduction(e.quality);
  const incentive = Math.max(0, RATES.incentivePool - ttDed - qDed);
  const overtimePay = att.exHours * RATES.extraHourRate;
  const extraShiftPay = att.extraShifts * RATES.extraShift;
  const calloutPen = att.callout * RATES.calloutDed;
  const ncnsPen = att.ncns * RATES.ncnsDed;
  const ulPen = att.ul * RATES.ulDed;
  const latePen = att.late * RATES.lateDed;
  const edPen = Math.round(att.edHours * RATES.edRate);
  const errorPen = Math.round(errorUsdTotal * errorRate);
  const gross = e.basic + incentive + overtimePay + extraShiftPay + e.arrears + e.specialReward;
  const deductions = calloutPen + ncnsPen + ulPen + latePen + edPen + e.loan + e.advance + e.tax + e.noticePeriod + e.fine + errorPen;
  return { ttDed, qDed, incentive, overtimePay, extraShiftPay, calloutPen, ncnsPen, ulPen, latePen, edPen, errorPen, gross, deductions, net: gross - deductions };
}
function money(n) { return "Rs " + Math.round(n).toLocaleString("en-PK"); }
function hrsLabel(h) {
  const whole = Math.floor(h);
  const mins = Math.round((h - whole) * 60);
  return mins ? `${whole}h ${mins}m` : `${whole}h`;
}
function scheduleBadgeClasses(value) {
  if (value === "OFF") return { wrap: "bg-amber-50 border-amber-200", text: "text-amber-700", pill: "bg-amber-100 text-amber-700" };
  if (value === "Unpaid Leave") return { wrap: "bg-rose-50 border-rose-200", text: "text-rose-700", pill: "bg-rose-100 text-rose-700" };
  if (value === "Paid Leave") return { wrap: "bg-sky-50 border-sky-200", text: "text-sky-700", pill: "bg-sky-100 text-sky-700" };
  if (value === "Extra Shift") return { wrap: "bg-emerald-50 border-emerald-200", text: "text-emerald-700", pill: "bg-emerald-100 text-emerald-700" };
  if (value === "Custom") return { wrap: "bg-indigo-50 border-indigo-200", text: "text-indigo-700", pill: "bg-indigo-100 text-indigo-700" };
  return { wrap: "border-slate-200", text: "text-slate-700", pill: "bg-slate-100 text-slate-600" };
}
// Base shift duration (hours) for a given shift key + day name.
// Fri/Sat run 1 hour longer on both shifts; Sunday on Second Shift ends 1 hour earlier.
function baseShiftHours(shiftKey, dayName) {
  if (shiftKey === "first") {
    if (dayName === "Friday" || dayName === "Saturday") return 10;
    return 9;
  }
  if (shiftKey === "second") {
    if (dayName === "Friday" || dayName === "Saturday") return 10.25;
    if (dayName === "Sunday") return 8.25;
    return 9.25;
  }
  return 0;
}
function formatTime12(t) {
  if (!t) return "";
  const [hStr, mStr] = t.split(":");
  let h = Number(hStr);
  const period = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${mStr} ${period}`;
}
function customRangeHours(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  let startMin = sh * 60 + sm, endMin = eh * 60 + em;
  if (endMin <= startMin) endMin += 24 * 60; // overnight shift
  return (endMin - startMin) / 60;
}
function dayHours(row, dayName) {
  const key = dayName.toLowerCase();
  const status = row[key];
  if (status === "Work" || status === "Extra Shift") return baseShiftHours(row.shift, dayName);
  if (status === "Custom") {
    const c = row.customHours && row.customHours[key];
    return c ? customRangeHours(c.start, c.end) : 0;
  }
  return 0; // OFF, Unpaid Leave, Paid Leave
}
function totalWeeklyHours(row) {
  return DAYS.reduce((sum, d) => sum + dayHours(row, d), 0);
}
// Calendar date for each entry in DAYS, given the Monday of that schedule week (YYYY-MM-DD)
function weekDayDates(mondayStr) {
  const monday = new Date(mondayStr + "T00:00:00");
  return DAYS.map((_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  });
}
function requestStatusPill(status) {
  if (status === "Approved" || status === "Fulfilled") return "bg-emerald-100 text-emerald-700";
  if (status === "Rejected") return "bg-rose-100 text-rose-700";
  return "bg-amber-100 text-amber-700";
}

                  <div className="p-5 bg-slate-50 border-b border-slate-200">
                    <div className="grid grid-cols-4 gap-2">
                      <select value={newTaskForm.empId} onChange={e=>setNewTaskForm({...newTaskForm,empId:Number(e.target.value)})}
                        className="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
                        {employees.map(emp=><option key={emp.id} value={emp.id}>{emp.name}</option>)}
                      </select>
                      <select value={newTaskForm.task} onChange={e=>setNewTaskForm({...newTaskForm,task:e.target.value})}
                        className="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
                        <option>Issuance of Account Opening Letter</option>
                        <option>Provisional Training Offer Letter</option>
                        <option>Warning Letter</option>
                        <option>Final Settlement Letter</option>
                        <option>Initial Interview</option>
                        <option>Final Interview</option>
                        <option>Other HR Task</option>
                      </select>
                      <input type="date" value={newTaskForm.dueDate} onChange={e=>setNewTaskForm({...newTaskForm,dueDate:e.target.value})}
                        className="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"/>
                      <button onClick={addHRTask} className="bg-orange-500 hover:bg-orange-600 text-white rounded-lg px-4 py-2 text-sm flex items-center justify-center gap-2">
                        <Plus size={15}/> Add Task
                      </button>
                    </div>
                    <input value={newTaskForm.notes} onChange={e=>setNewTaskForm({...newTaskForm,notes:e.target.value})}
                      placeholder="Notes / details" className="w-full mt-2 border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"/>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                      <thead className="bg-slate-50 text-xs text-slate-500 uppercase">
                        <tr><th className="text-left px-4 py-3">Employee</th><th className="text-left px-4 py-3">Task</th><th className="text-left px-4 py-3">Due Date</th><th className="text-left px-4 py-3">Notes</th><th className="text-center px-4 py-3">Status</th><th className="text-right px-4 py-3">Action</th></tr>
                      </thead>
                      <tbody>
                        {hrTasks.map(task=>{
                          const emp=employees.find(e=>e.id===task.empId);
                          return (
                            <tr key={task.id} className="border-t border-slate-100">
                              <td className="px-4 py-3 font-medium">{emp?.name}<p className="text-xs text-slate-400">{emp?.id}</p></td>
                              <td className="px-4 py-3">{task.task}</td>
                              <td className="px-4 py-3">{task.dueDate}</td>
                              <td className="px-4 py-3 text-slate-500">{task.notes}</td>
                              <td className="px-4 py-3 text-center"><span className={`px-2 py-1 rounded-full text-xs ${task.status==="Completed"?"bg-emerald-100 text-emerald-700":"bg-amber-100 text-amber-700"}`}>{task.status}</span></td>
                              <td className="px-4 py-3 text-right">
                                <button onClick={()=>toggleHRTask(task.id)} className={`px-3 py-1.5 rounded-lg text-xs ${task.status==="Completed"?"bg-slate-200 text-slate-700":"bg-teal-600 text-white"}`}>
                                  {task.status==="Completed"?"Mark Pending":"Mark Completed"}
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* ════════════════════════════════════════════════════════════
                TAB 3 — EMPLOYEE DETAILS
            ════════════════════════════════════════════════════════════ */}
            {hrTab === "employees" && (
              <div>
                {/* Add Employee toggle */}
                <div className="flex justify-between items-center mb-4">
                  <p className="text-sm text-slate-500">{employees.length} employees on record</p>
                  <button onClick={()=>setShowAddEmp(!showAddEmp)}
                    className="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg transition-all">
                    <Plus size={15}/> {showAddEmp ? "Cancel" : "Add New Employee"}
                  </button>
                </div>

                {/* Add Employee form */}
                {showAddEmp && (
                  <div className="bg-white rounded-xl border border-indigo-200 p-5 mb-5">
                    <h3 className="font-semibold text-indigo-700 mb-4 flex items-center gap-2"><UserPlus size={16}/>New Employee</h3>
                    <div className="grid grid-cols-3 gap-3 mb-3">
                      <div><label className="text-xs text-slate-500 block mb-1">Full Name *</label><input value={newEmpForm.name} onChange={e=>setNewEmpForm({...newEmpForm,name:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="e.g. Ahmed Ali"/></div>
                      <div><label className="text-xs text-slate-500 block mb-1">Employee ID *</label><input value={newEmpForm.id} onChange={e=>setNewEmpForm({...newEmpForm,id:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="e.g. 10260"/></div>
                      <div><label className="text-xs text-slate-500 block mb-1">Role</label>
                        <select value={newEmpForm.role} onChange={e=>setNewEmpForm({...newEmpForm,role:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                          <option>CSR</option><option>TSR</option><option>Supervisor</option>
                        </select>
                      </div>
                      <div><label className="text-xs text-slate-500 block mb-1">Contact Number</label><input value={newEmpForm.phone} onChange={e=>setNewEmpForm({...newEmpForm,phone:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="03xx-xxxxxxx"/></div>
                      <div><label className="text-xs text-slate-500 block mb-1">CNIC</label><input value={newEmpForm.cnic} onChange={e=>setNewEmpForm({...newEmpForm,cnic:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="xxxxx-xxxxxxx-x"/></div>
                      <div><label className="text-xs text-slate-500 block mb-1">Emergency Contact</label><input value={newEmpForm.emergencyContact} onChange={e=>setNewEmpForm({...newEmpForm,emergencyContact:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="03xx-xxxxxxx"/></div>
                      <div className="col-span-2"><label className="text-xs text-slate-500 block mb-1">Address</label><input value={newEmpForm.address} onChange={e=>setNewEmpForm({...newEmpForm,address:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="House #, Street, Area, City"/></div>
                      <div><label className="text-xs text-slate-500 block mb-1">Campaign</label>
                        <select value={newEmpForm.campaign} onChange={e=>setNewEmpForm({...newEmpForm,campaign:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                          <option>A</option><option>B</option>
                        </select>
                      </div>
                      <div><label className="text-xs text-slate-500 block mb-1">Employment Status</label>
                        <select value={newEmpForm.status} onChange={e=>setNewEmpForm({...newEmpForm,status:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                          <option>Contract</option><option>Probation</option><option>Notice Period</option>
                        </select>
                      </div>
                      <div><label className="text-xs text-slate-500 block mb-1">Basic Salary (Rs)</label><input type="number" value={newEmpForm.basic} onChange={e=>setNewEmpForm({...newEmpForm,basic:e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"/></div>
                    </div>
                    <button onClick={addNewEmployee} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-5 py-2 rounded-lg">
                      Save Employee
                    </button>
                  </div>
                )}

                {/* Employee Details Table */}
                <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                      <thead className="bg-slate-50 text-xs text-slate-500 uppercase border-b border-slate-200">
                        <tr>
                          <th className="text-left px-4 py-3">Employee</th>
                          <th className="text-left px-4 py-3">Campaign</th>
                          <th className="text-left px-4 py-3">Status</th>
                          <th className="text-left px-4 py-3">Contact</th>
                          <th className="text-left px-4 py-3">Emergency</th>
                          <th className="text-left px-4 py-3">CNIC</th>
                          <th className="text-left px-4 py-3">Address</th>
                        </tr>
                      </thead>
                      <tbody>
                        {employees.map(emp=>{
                          const det = empDetails.find(d=>d.id===emp.id) || {};
                          return (
                            <tr key={emp.id} className="border-t border-slate-100 hover:bg-slate-50/50 transition-colors">
                              <td className="px-4 py-3">
                                <p className="font-medium">{emp.name}</p>
                                <p className="text-xs text-slate-400">{emp.id} · {emp.role}</p>
                              </td>
                              <td className="px-4 py-3">
                                <select value={det.campaign||"A"} onChange={e=>saveEmpDetail(emp.id,"campaign",e.target.value)}
                                  className="border border-slate-200 rounded px-2 py-1 text-xs bg-white">
                                  <option>A</option><option>B</option>
                                </select>
                              </td>
                              <td className="px-4 py-3">
                                <select value={det.status||"Contract"} onChange={e=>saveEmpDetail(emp.id,"status",e.target.value)}
                                  className={`border rounded px-2 py-1 text-xs ${det.status==="Notice Period"?"bg-rose-50 border-rose-200 text-rose-700":det.status==="Probation"?"bg-amber-50 border-amber-200 text-amber-700":"bg-emerald-50 border-emerald-200 text-emerald-700"}`}>
                                  <option>Contract</option><option>Probation</option><option>Notice Period</option>
                                </select>
                              </td>
                              <td className="px-4 py-3">
                                <input value={det.phone||""} onChange={e=>saveEmpDetail(emp.id,"phone",e.target.value)}
                                  placeholder="03xx-xxxxxxx" className="border border-slate-200 rounded px-2 py-1 text-xs w-32"/>
                              </td>
                              <td className="px-4 py-3">
                                <input value={det.emergencyContact||""} onChange={e=>saveEmpDetail(emp.id,"emergencyContact",e.target.value)}
                                  placeholder="03xx-xxxxxxx" className="border border-slate-200 rounded px-2 py-1 text-xs w-32"/>
                              </td>
                              <td className="px-4 py-3">
                                <input value={det.cnic||""} onChange={e=>saveEmpDetail(emp.id,"cnic",e.target.value)}
                                  placeholder="xxxxx-xxxxxxx-x" className="border border-slate-200 rounded px-2 py-1 text-xs w-36"/>
                              </td>
                              <td className="px-4 py-3">
                                <input value={det.address||""} onChange={e=>saveEmpDetail(emp.id,"address",e.target.value)}
                                  placeholder="Address" className="border border-slate-200 rounded px-2 py-1 text-xs w-48"/>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* ════════════════════════════════════════════════════════════
                TAB 4 — GENERATE PAYROLL
            ════════════════════════════════════════════════════════════ */}
            {hrTab === "payroll" && (
              <div>
                <div className="flex items-center justify-between mb-6">
                  <div>
                    <h2 className="font-medium text-lg">Payroll — September 2026 cycle</h2>
                    <p className="text-sm text-slate-500">Review supervisor-submitted QA scores and attendance deductions, then generate payroll.</p>
                  </div>
                  <button onClick={() => setPayrollMsg("Payroll generated for September 2026.")} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg">Generate payroll</button>
                </div>
                {payrollMsg && <p className="text-sm text-teal-700 bg-teal-50 border border-teal-200 rounded-lg px-3 py-2 mb-4">{payrollMsg}</p>}

                <div className="grid grid-cols-4 gap-4 mb-6">
                  <div className="bg-white rounded-xl border border-slate-200 p-4"><p className="text-xs text-slate-500 mb-1">Headcount</p><p className="text-xl font-semibold">{totals.headcount}</p></div>
                  <div className="bg-white rounded-xl border border-slate-200 p-4"><p className="text-xs text-slate-500 mb-1">Total net payroll</p><p className="text-xl font-semibold">{money(totals.payroll)}</p></div>
                  <div className="bg-white rounded-xl border border-slate-200 p-4"><p className="text-xs text-slate-500 mb-1">Incentives paid</p><p className="text-xl font-semibold text-teal-700">{money(totals.incentives)}</p></div>
                  <div className="bg-white rounded-xl border border-slate-200 p-4"><p className="text-xs text-slate-500 mb-1">Deductions</p><p className="text-xl font-semibold text-rose-600">{money(totals.deductions)}</p></div>
                </div>

                <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead className="bg-slate-50 text-slate-500 text-xs uppercase"><tr><th className="text-left px-4 py-2">Employee</th><th className="text-center px-1 py-2">TT (s)</th><th className="text-center px-1 py-2">Qual %</th><th className="text-center px-2 py-2">Fine</th><th className="text-center px-2 py-2">Reward</th><th className="text-center px-2 py-2">Incentive</th><th className="text-center px-2 py-2">Deductions</th><th className="text-right px-4 py-2">Net pay</th></tr></thead>
                    <tbody>
                      {allPay.map((e) => (
                        <tr key={e.id} className="border-t border-slate-100">
                          <td className="px-4 py-2"><p className="font-medium">{e.name}</p><p className="text-xs text-slate-400">{e.role} · {e.id}</p></td>
                          <td className="px-1 py-2 text-center">
                            <input type="number" value={e.tt} onChange={(ev) => updateField(e.id, "tt", ev.target.value)}
                              className="w-16 border border-slate-200 rounded px-1 py-1 text-center text-xs" />
                          </td>
                          <td className="px-1 py-2 text-center">
                            <input type="number" value={e.quality} onChange={(ev) => updateField(e.id, "quality", ev.target.value)}
                              className="w-14 border border-slate-200 rounded px-1 py-1 text-center text-xs" />
                          </td>
                          <td className="px-2 py-2 text-center">
                            <input type="number" value={e.fine} onChange={(ev) => updateField(e.id, "fine", ev.target.value)}
                              className="w-20 border border-rose-200 rounded px-1 py-1 text-center text-xs text-rose-600" />
                          </td>
                          <td className="px-2 py-2 text-center">
                            <input type="number" value={e.specialReward} onChange={(ev) => updateField(e.id, "specialReward", ev.target.value)}
                              className="w-20 border border-emerald-200 rounded px-1 py-1 text-center text-xs text-emerald-700" />
                          </td>
                          <td className="px-2 py-2 text-center text-teal-700">{money(e.incentive)}</td>
                          <td className="px-2 py-2 text-center text-rose-600">{money(e.deductions)}</td>
                          <td className="px-4 py-2 text-right font-semibold">{money(e.net)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <p className="text-xs text-slate-400 mt-3">TT, Quality, Fine and Reward are editable here by HR and feed directly into Incentive, Deductions and Net pay. Loan, advance, tax, arrears and notice period are managed elsewhere.</p>
              </div>
            )}

          </>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<AizanERP />);
</script>
</body>
</html>
